# Telegraf Configuration for k6 load test monitoring
# Only non-default values are specified

[agent]
  interval = "1s"
  flush_interval = "1s"

[[outputs.file]]
  files = ["/metrics/loadtest-metrics.out", "stdout"]
  data_format = "json"

[[outputs.prometheus_client]]
  listen = ":9273"

# Host CPU metrics (per-core and total)
[[inputs.cpu]]
  percpu = true
  totalcpu = true
  report_active = true
  fieldinclude = ["usage_active", "usage_user", "usage_system", "usage_iowait"]

# Host Memory metrics
[[inputs.mem]]
  fieldinclude = ["used_percent", "used", "available"]

# Host System Load
[[inputs.system]]
  include = ["load"]
  fieldinclude = ["load1", "load5"]

# Per-container metrics for project containers (app, database, and k6)
[[inputs.docker]]
  container_name_include = ["diagramio_*", "*k6*"]
  perdevice_include = []
  total_include = ["cpu", "blkio"]
  fieldinclude = [
    "usage_percent",
    "usage",
    "limit",
    "io_service_bytes_recursive_read",
    "io_service_bytes_recursive_write"
  ]

# Spring Boot Actuator Prometheus Metrics (JVM Old Gen, GC Pauses, Live Threads, HikariCP)
[[inputs.prometheus]]
  urls = ["http://localhost:8080/actuator/prometheus"]
  interval = "1s"
  metric_version = 2
  response_timeout = "3s"

# PostgreSQL Metrics from diagramio_db (numbackends, xact_commit, xact_rollback, deadlocks, blks_hit, blks_read)
[[inputs.postgresql]]
  address = "postgres://root:secretpassword@localhost:5432/diagram_app?sslmode=disable"
  databases = ["diagram_app"]
  interval = "1s"
