
spring:
  application:
    name: diagramio
  threads:
    virtual:
      enabled: true
  datasource:
    # Default PostgreSQL configuration
    url: jdbc:postgresql://localhost:5432/diagram_app
    username: root
    password: secretpassword
    hikari:
      pool-name: DiagramIOPool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  docker:
    compose:
      start:
        arguments: "postgres"

server:
  forward-headers-strategy: framework

springdoc:
  writer-with-order-by-keys: true
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET:dev-only-secret-please-change-it-32chars}
  access-token-minutes: 15
  refresh-token-days: 7

diagramio:
  storage:
    blob-dir: ${DIAGRAMIO_STORAGE_PATH:data/blobs}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
